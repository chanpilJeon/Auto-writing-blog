[project]
name = "blogwriter"
version = "0.1.0"
description = "정보(URL·텍스트·메모)를 받아 내 말투의 블로그 글 초안을 자동 작성하는 CLI"
readme = "README.md"
authors = [
    { name = "chanpilJeon", email = "twinlove1022@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.3.0",
    "pyperclip>=1.11.0",
    "python-frontmatter>=1.3.0",
    "trafilatura>=2.2.0",
    "typer>=0.27.2",
]

[project.scripts]
blog = "blogwriter.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
